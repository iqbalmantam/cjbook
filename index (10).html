<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
<title>CJBook</title>
<style>
:root{
  --bg:#F2F5F4;--surface:#FFFFFF;--border:#D3DCD9;--text:#17262A;--muted:#566663;
  --accent:#0F766E;--on-accent:#FFFFFF;--accent-soft:#D9F0EC;--accent-text:#0B5A54;
  --danger:#B42318;--warn:#8A5200;--shadow:0 1px 2px rgba(15,40,36,.08),0 2px 8px rgba(15,40,36,.05);
  --r-sm:8px;--r-md:12px;--r-lg:16px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=dark]{
  --bg:#0E1716;--surface:#16221F;--border:#2B3C38;--text:#E6EFED;--muted:#A3B5B1;
  --accent:#2DD4BF;--on-accent:#04201C;--accent-soft:#12342F;--accent-text:#7EE8DA;
  --danger:#FF8A7A;--warn:#F5C26B;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:40px;padding:0 var(--s4);border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:32px;padding:0 var(--s3);font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;position:relative;color:var(--muted)}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent-text)}
.iconbtn.on{color:var(--accent-text);background:var(--accent-soft)}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
[data-theme=dark] .badge{color:#2a0a05}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);padding:var(--s4);margin-bottom:var(--s3)}
.card h2,.card h3{margin:0 0 var(--s3);font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:var(--s3)}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.spread{justify-content:space-between}
input[type=text],input[type=password],input[type=search],input[type=datetime-local],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--muted);border-radius:var(--r-sm);background:var(--surface)}
textarea{resize:vertical;min-height:84px}
label.f{display:block;font-weight:600;font-size:14px;margin:var(--s3) 0 var(--s1)}
.err{color:var(--danger);font-size:13px;margin-top:var(--s2)}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c,#0F766E);color:#fff;font-weight:700;flex:none;width:var(--sz,40px);height:var(--sz,40px);font-size:calc(var(--sz,40px)*.38);letter-spacing:.5px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:600}
.pill.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--border);margin:var(--s3) 0}
.tab{padding:10px var(--s4);border:0;background:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab.on{color:var(--accent-text);border-color:var(--accent)}
.empty{text-align:center;padding:var(--s6) var(--s4);color:var(--muted)}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--border),var(--accent-soft),var(--border));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:var(--s4)}
.auth-box{width:100%;max-width:400px}
.logo{display:inline-flex;align-items:center;gap:var(--s2);font-weight:800;font-size:24px;color:var(--accent-text);letter-spacing:-.5px}
.logo-mark{width:36px;height:36px;border-radius:11px 11px 11px 3px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:15px;font-weight:800;letter-spacing:0}
.demo{background:var(--accent-soft);color:var(--accent-text);border-radius:var(--r-sm);padding:var(--s3);font-size:13px;margin-top:var(--s4)}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);height:56px;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4)}
.top form{flex:1;max-width:320px}
.top input{border-radius:999px;border-color:var(--border);padding:8px 16px;background:var(--bg)}
.nav{display:flex;gap:2px;margin-left:auto}
.shell{max-width:1180px;margin:0 auto;padding:var(--s4);display:grid;grid-template-columns:240px minmax(0,1fr) 280px;gap:var(--s4)}
.side{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 88px);overflow:auto}
.sidelink{display:flex;align-items:center;gap:var(--s3);padding:8px var(--s3);border-radius:var(--r-sm);color:var(--text);font-weight:500;width:100%;border:0;background:none;text-align:left}
.sidelink:hover,.sidelink.on{background:var(--accent-soft);color:var(--accent-text);text-decoration:none}
.bottom{display:none}
@media (max-width:1000px){.shell{grid-template-columns:minmax(0,1fr) 280px}.side.left{display:none}}
.only-m,.mtop,.mtabs{display:none}
@media (max-width:720px){
  .only-m{display:inline-grid}
  .top{height:52px;padding:0 10px;gap:6px}
  .logo-mark{display:none}
  .logo{font-size:26px;letter-spacing:-1px}
  .top .nav{display:none}
  .mtop{display:flex;gap:8px;margin-left:auto}
  .iconbtn.rnd{background:var(--bg);border:1px solid var(--border);color:var(--text);width:38px;height:38px}
  .top form{display:none;position:absolute;left:0;right:0;top:52px;max-width:none;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border)}
  .top.searching form{display:block}
  .top input{min-width:0}
  .mtabs{display:flex;position:sticky;top:52px;z-index:19;background:var(--surface);border-bottom:1px solid var(--border)}
  .mtabs a{flex:1;display:grid;place-items:center;height:48px;position:relative;color:var(--muted);border-bottom:3px solid transparent}
  .mtabs a.on{color:var(--accent-text);border-color:var(--accent)}
  .mtabs .ic{width:26px;height:26px}
  .mtabs .badge{top:4px;right:calc(50% - 22px)}
  .shell{grid-template-columns:1fr;padding:0 0 24px}
  .side.right,.side.left,.bottom{display:none}
  main .card{border-radius:0;border-left:0;border-right:0;box-shadow:none;margin-bottom:8px}
  .menucard .sidelink{padding:12px 16px}
  form[data-form=post] textarea{min-height:44px;height:44px;border-radius:22px;padding:10px 16px;resize:none}
  form[data-form=post] textarea:focus{height:110px;border-radius:14px}
}

/* posts */
.post .head{display:flex;gap:var(--s3);align-items:center;margin-bottom:var(--s3)}
.post .body{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:var(--s3)}
.post img.m{width:100%;max-height:460px;object-fit:cover;border-radius:var(--r-sm);margin-bottom:var(--s3);display:block}
.post.ann{border-left:5px solid var(--accent)}
.reacts{display:flex;gap:var(--s2);flex-wrap:wrap;border-top:1px solid var(--border);padding-top:var(--s3)}
.rbtn{height:34px;padding:0 var(--s3);border-radius:999px;border:1px solid var(--border);background:var(--surface);display:inline-flex;gap:6px;align-items:center;font-size:14px}
.rbtn:hover{background:var(--accent-soft)}
.rbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:700}
.cm{display:flex;gap:var(--s2);margin-top:var(--s3)}
.cm .bub{background:var(--bg);border-radius:var(--r-md);padding:8px var(--s3);overflow-wrap:anywhere}
.cm.reply{margin-left:44px}
.cmform{display:flex;gap:var(--s2);margin-top:var(--s3)}
.cmform input{border-radius:999px}
.cover{height:180px;border-radius:var(--r-md) var(--r-md) 0 0;background:linear-gradient(135deg,var(--c),#0b3b38)}
.profilehead{margin-top:-48px;padding:0 var(--s4) var(--s3);display:flex;gap:var(--s4);align-items:flex-end;flex-wrap:wrap}
.profilehead .av{border:4px solid var(--surface)}
.person{display:flex;gap:var(--s3);align-items:center;padding:var(--s2) 0}

/* chat */
.chat{display:grid;grid-template-columns:260px 1fr;gap:var(--s3);min-height:60vh}
@media (max-width:720px){.chat{grid-template-columns:1fr}.chat.open .clist{display:none}.chat:not(.open) .cwin{display:none}}
.clist .item{display:flex;gap:var(--s3);padding:var(--s3);border-radius:var(--r-sm);width:100%;border:0;background:none;text-align:left;align-items:center}
.clist .item:hover,.clist .item.on{background:var(--accent-soft)}
.msgs{display:flex;flex-direction:column;gap:6px;height:48vh;overflow:auto;padding:var(--s2)}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;background:var(--bg);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}

/* modal & toast */
#modal:empty{display:none}
.scrim{position:fixed;inset:0;background:rgba(5,20,18,.55);z-index:50;display:grid;place-items:center;padding:var(--s4)}
.dlg{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:var(--s5);border:1px solid var(--border)}
.dlg h2{margin:0 0 var(--s3)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:var(--s2);align-items:center;pointer-events:none}
.t{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.switch{display:flex;justify-content:space-between;align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--border)}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
img.av{object-fit:cover;background:var(--border);display:inline-block}
.msg img{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-bottom:4px}
.msg.me a{display:block}
label.iconbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ctabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin:-4px -4px 10px;padding:0 4px}
.ctab{display:flex;align-items:center;flex:none;max-width:170px;border-bottom:3px solid transparent}
.ctab.on{border-color:var(--accent)}
.ctab a{display:flex;align-items:center;gap:6px;padding:8px 2px 8px 6px;color:var(--text);text-decoration:none;font-size:13px;font-weight:600;min-width:0}
.ctn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.ctx{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:6px 8px;cursor:pointer;border-radius:6px}
.ctx:hover,.ctx:focus-visible{background:var(--border);color:var(--text)}
/* cerita */
.stories{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:var(--s2);scrollbar-width:thin}
.scard{flex:none;width:112px;height:190px;border-radius:12px;border:1px solid var(--border);background:var(--surface);position:relative;overflow:hidden;padding:0;cursor:pointer;color:#fff;text-align:left}
.scard .sbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:grid;place-items:center}
.scard .stx{padding:10px;font-size:13px;font-weight:700;text-align:center;overflow:hidden;line-height:1.25;color:#fff}
.scard:not(.mine) .sbg::after{content:"";position:absolute;inset:0}
.scard .sav{position:absolute;top:8px;left:8px;border-radius:50%;border:3px solid var(--accent);display:grid;line-height:0;background:var(--surface)}
.scard .snm{position:absolute;left:8px;right:8px;bottom:8px;font-size:13px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .snm.dark{color:var(--text);text-shadow:none;text-align:center;bottom:10px}
.scard .splus{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:24px;line-height:1;border:3px solid var(--surface)}
.scard .sbg>.av{margin-top:-24px}
.scard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--text)}
.sscrim{background:rgba(0,0,0,.88);padding:0}
.sv{position:relative;width:100%;max-width:420px;height:100%;max-height:100vh;background:#000;display:flex;flex-direction:column;color:#fff}
@media (min-width:721px){.sv{height:92vh;border-radius:14px;overflow:hidden}}
.sbars{display:flex;gap:4px;padding:10px 10px 4px;z-index:2}
.sbars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.sbars span.on{background:#fff}
.shead{display:flex;align-items:center;gap:10px;padding:6px 10px;z-index:2}
.shead .small{opacity:.8}
.sbtn{border:0;background:rgba(255,255,255,.15);color:#fff;width:36px;height:36px;border-radius:50%;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer}
.sbtn .ic{width:18px;height:18px}
.sbody{flex:1;display:grid;place-items:center;overflow:hidden;position:relative}
.sbody img{width:100%;height:100%;object-fit:contain}
.sbig{font-size:26px;font-weight:800;text-align:center;padding:24px;overflow-wrap:anywhere;margin:0}
.scap{position:absolute;left:0;right:0;bottom:0;margin:0;padding:24px 16px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:17px;overflow-wrap:anywhere}
.snav{position:absolute;top:96px;bottom:0;width:40%;border:0;background:transparent;cursor:pointer;z-index:1}
.snav.prev{left:0}.snav.next{right:0}
.sumrow{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;padding:0 2px 8px}
.linkbtn{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:2px 4px}
.linkbtn:hover{text-decoration:underline}
@media (max-width:720px){.stories{padding:8px 10px 10px;margin:0;background:var(--surface);border-bottom:8px solid var(--bg)}.scard{width:104px;height:178px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="script.js"></script>
</body>
</html>
